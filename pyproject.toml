[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-analytics"
version = "0.1.0"
description = "Manager-visible analytics for Football Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fm-analytics = "fm_analytics.cli:main"
fm-bridge = "fm_analytics.bridge.server:main"
fm-web = "fm_analytics.web.server:main"

[project.optional-dependencies]
research = [
    "frida==17.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fm_analytics"]

[tool.hatch.build.targets.wheel.force-include]
"src/fm_analytics/fixtures/sample-game.json" = "fm_analytics/fixtures/sample-game.json"
"src/fm_analytics/analytics/data/catalogue.json" = "fm_analytics/analytics/data/catalogue.json"
