[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-analytics"
version = "0.1.0"
description = "Manager-visible analytics for Football Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.scripts]
fm-analytics = "fm_analytics.cli:main"
fm-bridge = "fm_analytics.bridge.server:main"
fm-web = "fm_analytics.web.server:main"
fm-knowledge = "fm_analytics.knowledge_ingest:main"
fm-matches = "fm_analytics.match_ingest:main"
fm-experiments = "fm_analytics.experiment_ingest:main"

[project.optional-dependencies]
research = [
    "frida==17.18.0",
    "unicorn==2.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fm_analytics"]

[tool.hatch.build.targets.wheel.force-include]
"src/fm_analytics/fixtures/sample-game.json" = "fm_analytics/fixtures/sample-game.json"

[dependency-groups]
dev = [
    "scipy>=1.16,<2",
]
