name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.26"

      - name: Install locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q src tools tests

      - name: Build Python package
        run: uv build --no-sources

      - name: Smoke-test the built wheel in a clean environment
        # The catalogue is data files, not code: a wheel that omits them imports
        # fine and fails only when the catalogue loads.
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "
          from fm_analytics.analytics.catalogue import MVP_CATALOGUE as C
          assert len(C.roles) >= 65 and len(C.tactics) >= 25, (len(C.roles), len(C.tactics))
          "

      - name: Run bridge fixture smoke test
        run: |
          uv run --no-sync fm-bridge --host 127.0.0.1 --port 5072 &
          bridge_pid=$!
          trap 'kill "$bridge_pid"' EXIT
          uv run --no-sync python -c "
          import time, sys
          from fm_analytics.api import BridgeClient
          for attempt in range(20):
              try:
                  assert BridgeClient('http://127.0.0.1:5072').get_health().is_ready
                  sys.exit(0)
              except Exception:
                  if attempt == 19:
                      raise
                  time.sleep(0.5)
          "
